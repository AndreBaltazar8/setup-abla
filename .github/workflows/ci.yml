name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Published Abla version to test on all five runners
        default: '0.2.70'
        type: string
      windows_arm64_version:
        description: Optional Windows-only version override for both architectures
        type: string

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: tests/static.sh

  toolchain:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      REQUESTED_VERSION: ${{ inputs.version || '0.2.16' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: first
        uses: ./
        with:
          version: ${{ env.REQUESTED_VERSION }}
      - name: Compile and run an Abla program
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.first.outputs.version }}
          FIRST_CACHE_HIT: ${{ steps.first.outputs.cache-hit }}
        run: |
          test "$INSTALLED_VERSION" = "$REQUESTED_VERSION"
          test "$FIRST_CACHE_HIT" = false
          test "$(ablac --version)" = "ablac $REQUESTED_VERSION"
          mkdir -p "$RUNNER_TEMP/abla-smoke"
          printf 'fun main: int = 0\n' > "$RUNNER_TEMP/abla-smoke/main.ab"
          cd "$RUNNER_TEMP/abla-smoke"
          ablac build main.ab -o hello
          ./hello
      - id: second
        uses: ./
        with:
          version: ${{ env.REQUESTED_VERSION }}
      - name: Verify the runner tool-cache hit
        shell: bash
        run: |
          test '${{ steps.second.outputs.cache-hit }}' = true
          test '${{ steps.second.outputs.path }}' = '${{ steps.first.outputs.path }}'

  windows:
    name: Installed Windows toolchain (${{ matrix.runner }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            machine: '8664'
          - runner: windows-11-arm
            machine: 'aa64'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: first
        uses: ./
        with:
          version: ${{ inputs.windows_arm64_version || inputs.version }}
      - id: second
        uses: ./
        with:
          version: ${{ inputs.windows_arm64_version || inputs.version }}
      - name: Verify the runner tool-cache hit
        shell: bash
        env:
          FIRST_PATH: ${{ steps.first.outputs.path }}
          SECOND_PATH: ${{ steps.second.outputs.path }}
          FIRST_CACHE_HIT: ${{ steps.first.outputs.cache-hit }}
          SECOND_CACHE_HIT: ${{ steps.second.outputs.cache-hit }}
        run: test "$FIRST_CACHE_HIT" = false && test "$SECOND_CACHE_HIT" = true && test "$FIRST_PATH" = "$SECOND_PATH"
      - name: Build and run a fast program twice with the default cache
        shell: pwsh
        env:
          ABLA_VERSION: ${{ steps.first.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:Path = "$env:ABLA_HOME/bin;$env:SystemRoot/System32"
          $work = Join-Path $env:RUNNER_TEMP 'abla-fast-smoke'
          New-Item -ItemType Directory -Path $work | Out-Null
          Set-Location $work
          $env:ABLA_CACHE_DIR = Join-Path $work 'cache'
          Set-Content -Encoding ascii app.ab 'fun main: int = 42'
          $failed = $false
          foreach ($build in 'first cached', 'second cached', 'no-cache') {
            $flags = @('build', 'app.ab', '--fast', '-o', 'app.exe')
            if ($build -eq 'no-cache') { $flags += '--no-cache' }
            if (Test-Path app.exe) { Remove-Item app.exe }
            ablac @flags
            $status = $LASTEXITCODE
            Write-Host "Abla $env:ABLA_VERSION $env:RUNNER_ARCH --fast $build build exit $status"
            if ($status -ne 0) { $failed = $true; continue }
            ./app.exe
            if ($LASTEXITCODE -ne 42) { $failed = $true; Write-Host "$build app exited $LASTEXITCODE instead of 42" }
          }
          if ($failed) { throw 'Windows fast-build smoke failed' }
          exit 0
      - name: Compile and run with the installed Windows toolchain
        shell: pwsh
        env:
          ABLA_VERSION: ${{ steps.first.outputs.version }}
          PE_MACHINE: ${{ matrix.machine }}
        run: |
          $env:Path = "$env:ABLA_HOME/bin;$env:SystemRoot/System32"
          if ((ablac --version) -cne "ablac $env:ABLA_VERSION") { throw 'wrong compiler version' }
          $pe = [IO.File]::ReadAllBytes((Get-Command ablac).Source)
          $header = [BitConverter]::ToInt32($pe, 0x3c)
          if ([BitConverter]::ToUInt16($pe, $header + 4) -ne [Convert]::ToUInt16($env:PE_MACHINE, 16)) { throw 'wrong compiler PE architecture' }
          Set-Location $env:RUNNER_TEMP
          $env:ABLA_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'abla-compiler-cache'
          Set-Content -Encoding ascii hello.ab 'fun main: int = 42'
          foreach ($mode in 'no-cache', 'default') {
            $image = "hello-$mode.exe"
            $flags = @('build', 'hello.ab', '-o', $image, '--backtrace')
            if ($mode -eq 'no-cache') { $flags += '--no-cache' }
            ablac @flags
            if ($LASTEXITCODE -ne 0) { throw "$mode hello build failed" }
            if (!(Test-Path "$image.debug" -PathType Leaf)) { throw "$mode split debug info missing" }
            & ".\$image"
            if ($LASTEXITCODE -ne 42) { throw "$mode hello exited $LASTEXITCODE" }
            Write-Host "hello built and ran ($mode)"
          }
          exit 0
